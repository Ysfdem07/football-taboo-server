<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordico - Kelime Tahmin Oyunu / Word Guessing Game</title>
    <style>
        :root {
            --primary: #4CAF50;
            --dark: #121212;
            --light: #ffffff;
            --gray: #f5f5f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--light);
            text-align: center;
        }
        header {
            position: relative;
            padding: 50px 20px;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            border-bottom: 3px solid var(--primary);
        }
        h1 {
            font-size: 3em;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.subtitle {
            font-size: 1.2em;
            color: #aaa;
            margin-top: 10px;
        }
        .lang-switch {
            position: absolute;
            top: 16px;
            right: 20px;
            display: flex;
            gap: 6px;
        }
        .lang-switch button {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
        }
        .lang-switch button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #111;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .feature-box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 30%;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .feature-box h3 {
            color: var(--primary);
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #000;
            color: #777;
        }
        a {
            color: var(--primary);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .links {
            margin-top: 30px;
        }
        .links a {
            margin: 0 15px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <header>
        <div class="lang-switch">
            <button id="btn-tr" onclick="setLang('tr')">TR</button>
            <button id="btn-en" onclick="setLang('en')">EN</button>
        </div>
        <h1>Wordico</h1>
        <p class="subtitle" data-tr="Yeni Nesil Kelime Tahmin Oyunu" data-en="The Next-Gen Word Guessing Game"></p>
    </header>

    <div class="container">
        <p data-tr="Wordico ile arkadaşlarınızla veya dünyanın dört bir yanından oyuncularla rekabet edin. Kelime bilginizi sınayın, ipuçlarını kullanın ve zirveye çıkın!"
           data-en="Compete with your friends or players from around the world on Wordico. Test your word knowledge, use the hints, and climb to the top!"></p>

        <div class="features">
            <div class="feature-box">
                <h3 data-tr="Çok Oyunculu" data-en="Multiplayer"></h3>
                <p data-tr="Arkadaşlarınızla odalar kurun ve eş zamanlı oynayın." data-en="Create rooms and play in real time with your friends."></p>
            </div>
            <div class="feature-box">
                <h3 data-tr="Zengin İçerik" data-en="Rich Content"></h3>
                <p data-tr="Sürekli güncellenen binlerce kelime ve futbol konsepti." data-en="Thousands of constantly updated words and football concepts."></p>
            </div>
            <div class="feature-box">
                <h3 data-tr="Hızlı ve Eğlenceli" data-en="Fast and Fun"></h3>
                <p data-tr="Sadece 5 saniyelik ipuçlarıyla hızlı düşünme pratiği." data-en="Quick-thinking fun with hints revealed every 5 seconds."></p>
            </div>
        </div>

        <div class="links">
            <a href="/gizlilik.html" data-tr="Gizlilik Politikası" data-en="Privacy Policy"></a>
            <a href="/sartlar.html" data-tr="Kullanım Koşulları" data-en="Terms of Use"></a>
            <a href="/destek.html" data-tr="Destek" data-en="Support"></a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Wordico. <span data-tr="Tüm hakları saklıdır." data-en="All rights reserved."></span></p>
        <p><span data-tr="İletişim" data-en="Contact"></span>: <a href="mailto:info@wordico.net">info@wordico.net</a></p>
    </footer>

    <script>
        function setLang(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
                el.textContent = el.getAttribute('data-' + lang);
            });
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            try { localStorage.setItem('wordico_lang', lang); } catch (e) {}
        }

        (function () {
            var saved = null;
            try { saved = localStorage.getItem('wordico_lang'); } catch (e) {}
            var browserLang = (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
            setLang(saved || browserLang);
        })();
    </script>

</body>
</html>
